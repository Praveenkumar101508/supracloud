<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Components · Terminal</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#0A192F; font-family: var(--sc-font-sans); }
  .term { border:1px solid rgba(255,255,255,0.10); border-radius:12px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); }
  .chrome { display:flex; align-items:center; gap:6px; padding:10px 14px; background:rgba(30,41,59,0.8); border-bottom:1px solid rgba(255,255,255,0.06); }
  .dot { width:11px; height:11px; border-radius:50%; }
  .title { margin-left:10px; font-family:'JetBrains Mono', monospace; font-size:11px; color:#64748B; }
  .body { background:rgba(15,23,42,0.9); padding:14px 18px; font-family:'JetBrains Mono', monospace; font-size:12px; color:#60A5FA; line-height:1.7; }
  .cursor { display:inline-block; width:7px; height:13px; background:#60A5FA; vertical-align:-2px; margin-left:1px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
  <div class="term">
    <div class="chrome">
      <span class="dot" style="background:#EF4444"></span>
      <span class="dot" style="background:#F59E0B"></span>
      <span class="dot" style="background:#3B82F6"></span>
      <span class="title">supracloud-agent-runtime</span>
    </div>
    <div class="body">
      $ initialising SupraCloud enterprise runtime...<br>
      $ deploying banking-ai-agent v3.2.1 → production<br>
      $ L1_deflection_rate: 63% ↑ | SLA: 99.97%<span class="cursor"></span>
    </div>
  </div>
</body>
</html>
