<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Components · Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px; background:#fff; font-family: var(--sc-font-sans); }
  .stack { display:flex; flex-direction:column; gap:12px; max-width:560px; }
  label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px; }
  input, textarea { width:100%; box-sizing:border-box; padding:10px 14px; border:1px solid #E2E8F0; border-radius:8px; font-size:14px; font-family:inherit; color:#111827; }
  input:focus, textarea:focus { outline:none; border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,0.15); }
  .choice {
    display:flex; align-items:flex-start; gap:10px; padding:14px; border:2px solid #3B82F6; background:#EFF6FF;
    border-radius:12px; font-size:14px; font-weight:600; color:#065F46; cursor:pointer;
  }
  .check { width:18px; height:18px; border-radius:6px; background:#3B82F6; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; }
</style>
</head>
<body>
  <div class="stack">
    <div><label>Email</label><input value="rk@supracloud.co.uk"></div>
    <div><label>Company / Organisation</label><input placeholder="HSBC UK"></div>
    <div class="choice">
      <span class="check">✓</span>
      <span>AI Agent Development<br><span style="font-weight:400;color:#2563EB;font-size:12px">Banking or retail support automation</span></span>
    </div>
  </div>
</body>
</html>
