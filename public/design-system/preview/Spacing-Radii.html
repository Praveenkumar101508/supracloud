<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px; background:#fff; font-family: var(--sc-font-sans); }
  .row { display:grid; grid-template-columns: repeat(6, 1fr); gap:12px; }
  .swatch { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .box { width:84px; height:64px; background:#EFF6FF; border:1px solid #BFDBFE; }
  .name { font-size:11px; font-weight:600; color:#111827; }
  .px { font-family:'JetBrains Mono', monospace; font-size:10px; color:#6B7280; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch"><div class="box" style="border-radius:6px"></div><div class="name">sm</div><div class="px">6px</div></div>
    <div class="swatch"><div class="box" style="border-radius:8px"></div><div class="name">md</div><div class="px">8px</div></div>
    <div class="swatch"><div class="box" style="border-radius:12px"></div><div class="name">lg</div><div class="px">12px</div></div>
    <div class="swatch"><div class="box" style="border-radius:16px"></div><div class="name">xl</div><div class="px">16px</div></div>
    <div class="swatch"><div class="box" style="border-radius:24px"></div><div class="name">2xl</div><div class="px">24px</div></div>
    <div class="swatch"><div class="box" style="border-radius:9999px"></div><div class="name">pill</div><div class="px">∞</div></div>
  </div>
</body>
</html>
