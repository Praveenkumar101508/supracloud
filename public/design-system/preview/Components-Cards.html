<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Components · Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#0A192F; font-family: var(--sc-font-sans); }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .card-light { background:#F8FAFC; border:1px solid #F1F5F9; border-radius:18px; padding:18px; }
  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:18px; color:#fff; }
  .icon-bin { width:38px; height:38px; border-radius:10px; background:#EFF6FF; border:1px solid #BFDBFE; display:flex; align-items:center; justify-content:center; margin-bottom:12px; color:#3B82F6; font-size:18px; font-weight:700;}
  .icon-bin.dark { background:rgba(59,130,246,0.10); border-color:rgba(59,130,246,0.20); color:#60A5FA; }
  h4 { margin:0 0 6px; font-size:15px; font-weight:700; color:#111827; }
  .glass h4 { color:#fff; }
  p { margin:0; font-size:12px; line-height:1.55; color:#6B7280; }
  .glass p { color:#94A3B8; }
</style>
</head>
<body>
  <div class="row">
    <div class="card-light">
      <div class="icon-bin">⚡</div>
      <h4>Enterprise IT Services</h4>
      <p>Vetted IT staffing for contract and permanent roles, plus strategic technology advisory.</p>
    </div>
    <div class="glass">
      <div class="icon-bin dark">⚡</div>
      <h4>Banking AI Agents</h4>
      <p>L1 &amp; L2 customer support automation for financial services. 63% deflection.</p>
    </div>
  </div>
</body>
</html>
