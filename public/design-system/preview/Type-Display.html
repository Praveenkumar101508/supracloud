<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type · Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--sc-font-sans); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .meta { font-family:var(--sc-font-mono); font-size:10px; color:var(--sc-fg-4); letter-spacing:0; margin-top:2px; }
  .display { font-size:48px; font-weight:800; line-height:1.05; letter-spacing:-0.02em; color:#111827; }
  .h2 { font-size:32px; font-weight:700; line-height:1.15; letter-spacing:-0.02em; color:#111827; }
  .grad {
    background: linear-gradient(135deg,#3B82F6,#60A5FA);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div class="display">Autonomous AI Agents for <span class="grad">Global Enterprise</span></div>
      <div class="meta">Inter · 800 · 48–60px · -0.02em · leading 1.05</div>
    </div>
    <div>
      <div class="h2">Three Pillars of Enterprise Capability</div>
      <div class="meta">Inter · 700 · 32–36px · -0.02em · leading 1.15</div>
    </div>
  </div>
</body>
</html>
